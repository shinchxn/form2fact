version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: form2fact-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-form2fact_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-form2fact_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-form2fact_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U form2fact_admin -d form2fact_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: form2fact-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: form2fact-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-form2fact_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-form2fact_minio_secret_key_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ../ai_service
      dockerfile: Dockerfile
    container_name: form2fact-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      WORKERS: 2
    depends_on:
      - redis

  api-server:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: form2fact-api-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://form2fact_admin:form2fact_secure_password_2026@postgres:5432/form2fact_db
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: form2fact_minio_admin
      S3_SECRET_KEY: form2fact_minio_secret_key_2026
      S3_BUCKET: form2fact-dockets
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:

